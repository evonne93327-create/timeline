<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<!-- interactive-widget=resizes-content：軟體鍵盤彈出時把版面壓縮，
     而不是整頁往上推（推上去的話正在打的欄位會被鍵盤蓋住）。
     刻意不加 user-scalable=no：那會擋掉雙指放大，看不清楚的人沒辦法自救。 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F3EEE2">
<title>時間軸</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui-tokens.css">
<link rel="stylesheet" href="style.css">
<script>
/* 主題要在畫面出現之前就決定好。等 js/theme.js 載入再套用的話，
   夜間模式的使用者會先看到一閃的白底。 */
(function () {
  try {
    var v = localStorage.getItem("timeline_theme");
    var dark = (v === "dark") || (v !== "light" &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
    if (dark) document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) { /* 讀不到就用日間，不要讓這裡的例外擋住整頁 */ }
})();
</script>
</head>
<body>

<!-- 電腦版是「側邊欄 + 主區」，手機版只剩主區（側邊欄與桌面工具列都收起來，
     改用頂部那條與右下角的浮動按鈕）。兩套共用同一份資料與同一批函式，
     差別只在 CSS 顯示哪一組。 -->
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">時間軸</div>
    <div class="sidebar-list" id="sidebarList"></div>
    <button type="button" class="sidebar-add" onclick="openTimelineEditModal(null)">＋ 新增時間軸</button>
    <div class="sidebar-foot">
      <button type="button" class="sidebar-settings" onclick="openSettingsModal()">⚙️ 設定</button>
    </div>
  </aside>

  <div class="main">

    <header class="topbar">
      <button type="button" class="tl-badge" onclick="openTimelineModal()" title="切換時間軸">
        <span class="tl-badge-icon" id="tlIcon">📜</span>
        <span class="tl-badge-text">
          <span class="tl-badge-name" id="tlName">主世界年表</span>
          <span class="tl-badge-count" id="tlCount"></span>
        </span>
        <span class="tl-badge-caret">▾</span>
      </button>
      <button type="button" class="icon-btn" id="settingsBtn" onclick="openSettingsModal()" title="設定">⚙️</button>
    </header>

    <!-- 電腦版的標題列。名稱與「新增事件」擺在一起，不要像手機那樣
         一個在左上角、一個在右下角隔著整個螢幕。 -->
    <div class="deskbar">
      <!-- 內層再包一次並置中：標題與「新增事件」要落在時間軸那一欄的正上方。
           讓它貼齊整條橫列的兩端的話，標題在最左、內容在中間，看起來像
           兩個不相干的東西。 -->
      <div class="deskbar-inner">
        <div class="deskbar-text">
          <span class="deskbar-icon" id="tlIconDesk">📜</span>
          <span class="deskbar-name" id="tlNameDesk">主世界年表</span>
          <span class="deskbar-count" id="tlCountDesk"></span>
        </div>
        <button type="button" class="btn btn-primary" onclick="openEventModal()">＋ 新增事件<kbd class="kbd">N</kbd></button>
      </div>
    </div>

    <main class="page">
      <div class="axis" id="axis"></div>

      <div class="empty" id="emptyState">
        <div class="empty-icon">📜</div>
        <div class="empty-title">這條時間軸還沒有事件</div>
        <div class="empty-text" id="emptyText"></div>
      </div>
    </main>

  </div>
</div>

<button type="button" class="fab" onclick="openEventModal()" title="新增事件">＋</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ========== 事件 ========== -->
<div class="modal-overlay" id="eventModal">
  <div class="modal-card">
    <div class="modal-head">
      <span class="modal-title" id="evModalTitle">新增事件</span>
      <button type="button" class="icon-btn" onclick="closeEventModal()" title="關閉">✕</button>
    </div>

    <label class="field">
      <span class="field-label">標題</span>
      <input type="text" id="evTitleInput" class="input" placeholder="例如：北境之戰" maxlength="200">
    </label>

    <label class="field">
      <span class="field-label">時間</span>
      <input type="text" id="evWhenInput" class="input" placeholder="例如：舊曆340年 春" maxlength="100">
    </label>

    <div class="field">
      <span class="field-label">排序值</span>
      <div class="field-row">
        <input type="number" id="evSortInput" class="input" step="1">
        <button type="button" class="btn btn-secondary" onclick="guessSortFromWhen()">從時間猜</button>
      </div>
      <!-- 為什麼會有這個欄位，要講清楚，否則使用者只會覺得莫名其妙 -->
      <span class="field-hint">年表的時間多半不是真實日期（「舊曆340年」），沒辦法直接比大小，所以另外用這個數字決定先後。數字小的排前面，留空會接在最後。</span>
    </div>

    <div class="field">
      <span class="field-label">分類</span>
      <div class="cat-picker" id="evCategoryPicker"></div>
    </div>

    <label class="field">
      <span class="field-label">描述</span>
      <textarea id="evBodyInput" class="input textarea" rows="4" placeholder="這件事發生了什麼、牽涉到誰⋯⋯"></textarea>
    </label>

    <div class="modal-actions">
      <button type="button" class="btn btn-danger" id="evDeleteBtn" onclick="deleteEvent()">刪除</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-secondary" onclick="closeEventModal()">取消</button>
      <button type="button" class="btn btn-primary" onclick="submitEvent()">儲存</button>
    </div>
  </div>
</div>

<!-- ========== 時間軸清單 ========== -->
<div class="modal-overlay" id="timelineModal">
  <div class="modal-card">
    <div class="modal-head">
      <span class="modal-title">時間軸</span>
      <button type="button" class="icon-btn" onclick="closeTimelineModal()" title="關閉">✕</button>
    </div>
    <div class="tl-list" id="timelineList"></div>
    <div class="modal-actions">
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary" onclick="openTimelineEditModal(null)">＋ 新增時間軸</button>
    </div>
  </div>
</div>

<!-- ========== 時間軸的編輯 ========== -->
<div class="modal-overlay" id="timelineEditModal">
  <div class="modal-card">
    <div class="modal-head">
      <span class="modal-title" id="tlEditTitle">新增時間軸</span>
      <button type="button" class="icon-btn" onclick="closeTimelineEditModal()" title="關閉">✕</button>
    </div>

    <label class="field">
      <span class="field-label">名稱</span>
      <input type="text" id="tlNameInput" class="input" placeholder="例如：主世界年表" maxlength="100">
    </label>

    <div class="field">
      <span class="field-label">圖示</span>
      <div class="icon-picker" id="tlIconPicker"></div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-danger" id="tlDeleteBtn" onclick="deleteTimeline()">刪除</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-secondary" onclick="closeTimelineEditModal()">取消</button>
      <button type="button" class="btn btn-primary" onclick="submitTimelineEdit()">儲存</button>
    </div>
  </div>
</div>

<!-- ========== 設定總表 ========== -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-card">
    <div class="modal-head">
      <span class="modal-title">⚙️ 設定</span>
      <button type="button" class="icon-btn" onclick="closeSettingsModal()" title="關閉">✕</button>
    </div>

    <div class="settings-list">
      <button type="button" class="settings-row" onclick="settingsGoTo(openAppearanceModal)">
        <span class="settings-row-icon">🌓</span>
        <span class="settings-row-text">
          <span class="settings-row-title">外觀</span>
          <span class="settings-row-desc">日間、夜間或跟隨系統</span>
        </span>
        <span class="settings-row-value" id="appearanceValue"></span>
        <span class="settings-row-go">›</span>
      </button>

      <button type="button" class="settings-row" onclick="settingsGoTo(openTimelineModal)">
        <span class="settings-row-icon">📜</span>
        <span class="settings-row-text">
          <span class="settings-row-title">時間軸管理</span>
          <span class="settings-row-desc">新增、改名、刪除</span>
        </span>
        <span class="settings-row-value" id="timelineRowValue"></span>
        <span class="settings-row-go">›</span>
      </button>

      <button type="button" class="settings-row" onclick="exportAll()">
        <span class="settings-row-icon">📤</span>
        <span class="settings-row-text">
          <span class="settings-row-title">匯出備份</span>
          <span class="settings-row-desc">全部資料存成一個 JSON 檔下載</span>
        </span>
      </button>

      <button type="button" class="settings-row" onclick="triggerImport()">
        <span class="settings-row-icon">📥</span>
        <span class="settings-row-text">
          <span class="settings-row-title">匯入備份</span>
          <span class="settings-row-desc">會取代目前全部的資料（匯入前自動先備份一份）</span>
        </span>
      </button>
    </div>

    <p class="settings-note">資料只存在這台裝置的瀏覽器裡，沒有雲端。換手機或清除瀏覽器資料之前，記得先匯出備份。</p>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="handleImportFile(event)">
  </div>
</div>

<!-- ========== 外觀 ========== -->
<div class="modal-overlay" id="appearanceModal">
  <div class="modal-card">
    <div class="modal-head">
      <span class="modal-title">🌓 外觀</span>
      <button type="button" class="icon-btn" onclick="closeAppearanceModal()" title="關閉">✕</button>
    </div>
    <div class="theme-choice" id="themeChoice">
      <button type="button" class="theme-opt" data-theme="light" onclick="setThemePref('light')">☀️ 日間</button>
      <button type="button" class="theme-opt" data-theme="dark" onclick="setThemePref('dark')">🌙 夜間</button>
      <button type="button" class="theme-opt" data-theme="auto" onclick="setThemePref('auto')">🔄 跟隨系統</button>
    </div>
    <div class="settings-hint" id="themeAutoHint"></div>
  </div>
</div>

<!-- ========== 存檔出問題 ========== -->
<div class="modal-overlay" id="storageModal">
  <div class="modal-card">
    <div class="modal-head">
      <span class="modal-title">⚠️ 存檔失敗</span>
      <button type="button" class="icon-btn" onclick="closeStorageModal()" title="關閉">✕</button>
    </div>
    <p class="modal-lead" id="storageDetail"></p>
    <!-- 這行是固定的，不由 JS 決定：不管是哪一種存檔失敗，
         「現在看到的東西關掉分頁就沒了」都成立，而且這是最要緊的一句。 -->
    <p class="modal-warn">畫面上看到的內容還在，但只要關掉這個分頁就會消失。請先備份。</p>
    <p class="field-hint" id="storageHint"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-primary btn-wide" onclick="exportAll()">💾 立刻匯出備份</button>
      <button type="button" class="btn btn-secondary" onclick="closeStorageModal()">知道了</button>
    </div>
  </div>
</div>

<!-- ========== 有新版本 ========== -->
<div class="modal-overlay" id="updateModal">
  <div class="modal-card">
    <span class="modal-title">✨ 有新版本</span>
    <p class="field-hint">程式已經更新，重新載入之後才會套用。資料都存在這台裝置上，重新載入不會遺失。</p>
    <div class="modal-actions">
      <span class="spacer"></span>
      <button type="button" class="btn btn-secondary" onclick="dismissUpdateModal()">稍後再說</button>
      <button type="button" class="btn btn-primary" onclick="reloadForUpdate()">重新載入</button>
    </div>
  </div>
</div>

<script src="js/state.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/timeline.js"></script>
<script src="js/events.js"></script>
<script src="js/theme.js"></script>
<script src="js/io.js"></script>
<script src="js/app.js"></script>
</body>
</html>
